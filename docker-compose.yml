services:
  db:
    image: postgres:12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: password # 適切なパスワードに変更
      POSTGRES_DB: rails_app_development # データベース名

  web:
    build: . # 先の Dockerfile を使用
    user: rails
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/app # ホストとコンテナのファイルを同期
      - bundle_cache:/usr/local/bundle # Gem をキャッシュ
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgres://rails:password@db:5432/rails_app_development" # DB 接続情報
      RAILS_ENV: development # 開発環境 (必要に応じて production に変更)
      SECRET_KEY_BASE: your_secret_key # 非常に長いランダムな文字列に置き換える (必須)

volumes:
  postgres_data:
  bundle_cache: